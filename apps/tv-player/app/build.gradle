plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.google.devtools.ksp"
}

def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}

def apiBaseUrl = localProps.getProperty("api.base.url", "")
def escapedUrl = "\"${apiBaseUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""

android {
    namespace "qa.e3.signage.player"
    compileSdk 36

    defaultConfig {
        applicationId "qa.e3.signage.player"
        minSdk 24
        targetSdk 36
        versionCode 21
        versionName "0.21.0"
        buildConfigField "String", "API_BASE_URL", escapedUrl
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.media3.common.util.UnstableApi"]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "e3-signage-player-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

def repoDistDir = new File(rootProject.projectDir, "../../dist").canonicalFile

afterEvaluate {
    android.applicationVariants.all { variant ->
        def buildType = variant.buildType.name
        def versionName = variant.versionName
        def copyTask = tasks.register("copy${variant.name.capitalize()}ApkToDist") {
            doLast {
                def apkName = "e3-signage-player-${versionName}-${buildType}.apk"
                def apkDir = layout.buildDirectory.dir("outputs/apk/${buildType}").get().asFile
                def src = new File(apkDir, apkName)
                if (!src.exists()) {
                    src = new File(apkDir, "app-${buildType}.apk")
                }
                if (!src.exists()) {
                    throw new GradleException("Player APK not found in ${apkDir}")
                }
                repoDistDir.mkdirs()
                def dest = new File(repoDistDir, apkName)
                java.nio.file.Files.copy(
                        src.toPath(),
                        dest.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                logger.lifecycle("Copied player APK to ${dest} (${dest.length()} bytes)")
            }
        }
        variant.assembleProvider.configure { finalizedBy copyTask }
    }
}

dependencies {
    implementation project(":core")
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
