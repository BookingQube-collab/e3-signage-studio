org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning
# Gradle 8.11 cannot run on JDK 25 (class file major version 69). The IDE Tooling
# API ignores gradlew.bat, so pin an ABSOLUTE JDK 17 home. Relative paths fail with:
# "Cannot convert relative path … to an absolute file" and gradle-server reports 0 tasks.
org.gradle.java.home=A:/Live Projects/E3 Signage Studio/.tools/jdk-17
org.gradle.java.installations.paths=A:/Live Projects/E3 Signage Studio/.tools/jdk-17
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
